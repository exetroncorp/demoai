# nginx-router for <uid>.domain.com and <uid>-<port>.domain.com
# Requires a headless Service named workspace-<uid> (see workspace-headless-svc.yaml).
# Headless svc DNS returns the pod IP directly -> any port works, nothing to declare.

worker_processes auto;
events { worker_connections 1024; }

http {
  # Mandatory: proxy_pass uses variables, so nginx resolves at request time.
  # kube-dns service IP/name; adjust namespace if your DNS svc is elsewhere.
  resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

  # proper Connection header for websockets
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Regex server_names are tested in order of appearance, so the
  # uid-port block must come BEFORE the plain uid block.
  # Greedy uid match: app-ess696-8080.domain.com -> uid="app-ess696" port="8080"

  server {
    listen 80;
    server_name ~^(?<uid>[a-z0-9][a-z0-9-]*[a-z0-9])-(?<port>[0-9]{1,5})\.domain\.com$;

    # reject ports that make no sense
    if ($port ~ ^(0|1[0-9]{1,3}|[2-9][0-9]{0,2})$) { return 404; }  # only >= 2000

    location / {
      proxy_pass http://workspace-$uid.default.svc.cluster.local:$port;  # change namespace
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  # Existing route: ess696.domain.com -> workspace-ess696:10090
  server {
    listen 80;
    server_name ~^(?<uid>[a-z0-9][a-z0-9-]*[a-z0-9])\.domain\.com$;

    location / {
      proxy_pass http://workspace-$uid.default.svc.cluster.local:10090;  # change namespace
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
